name: Build Plesk Investor

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plesk-investor
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Plesk investor site
        run: npm run build
        env:
          VITE_BASE_PATH: /investor/
          VITE_DEFAULT_PAGE: neuro

      - name: Publish static build branch
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: plesk-investor
          publish_dir: ./dist
          force_orphan: true
