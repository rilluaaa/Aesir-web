<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Project | AESIR</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f3ef;
        --panel: #ffffff;
        --line: #e4e5df;
        --text: #1b1816;
        --muted: #716963;
        --accent: #8d4d3b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: "DM Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(940px, calc(100% - 32px));
        margin: 0 auto;
        padding: 48px 0;
      }

      a {
        color: inherit;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 28px;
      }

      .brand {
        color: var(--text);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }

      .back {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 10px 14px;
        text-decoration: none;
        color: var(--muted);
      }

      .panel {
        overflow: hidden;
        border: 0;
        border-radius: 28px;
        background: var(--panel);
        box-shadow: 0 24px 70px rgba(64, 43, 34, 0.1);
      }

      .media {
        display: grid;
        place-items: center;
        min-height: 280px;
        padding: clamp(16px, 3vw, 32px);
        background: #c7b5a2;
      }

      img {
        display: block;
        width: auto;
        max-width: 100%;
        height: auto;
        max-height: 62vh;
        object-fit: contain;
      }

      .content {
        padding: 28px;
      }

      .category {
        display: inline-flex;
        margin-bottom: 16px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #f1e5dc;
        padding: 7px 11px;
        color: var(--accent);
        font-size: 12px;
        font-weight: 800;
      }

      h1 {
        margin: 0;
        max-width: 820px;
        font-size: clamp(32px, 5vw, 56px);
        font-family: "Crimson Text", Georgia, serif;
        font-weight: 400;
        letter-spacing: -0.04em;
        line-height: 1;
      }

      .description {
        max-width: 72ch;
        margin: 24px 0 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.75;
        white-space: pre-line;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 24px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        border-radius: 999px;
        padding: 11px 16px;
        text-decoration: none;
        font-weight: 800;
      }

      .primary {
        background: var(--accent);
        color: #ffffff;
      }

      .button:hover,
      .back:hover {
        transform: translateY(-2px);
      }

      .button,
      .back {
        transition: transform 160ms ease, background 160ms ease;
      }

      .availability-note {
        margin: 24px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="topbar">
        <div class="brand">AESIR</div>
        <a class="back" href="./">Back to website</a>
      </div>

      <article class="panel">
        <div class="media">
          <img id="media" src="./assets/aesir/ernest-reading.webp" alt="AESIR project media" />
        </div>
        <div class="content">
          <span class="category" id="category"></span>
          <h1 id="title"></h1>
          <p class="description" id="description"></p>
          <div class="actions" id="actions">
            <a class="button primary" id="source" target="_blank" rel="noopener noreferrer">Open Project</a>
          </div>
          <p class="availability-note" id="availability" hidden>This archive record does not currently have a verified public project link.</p>
        </div>
      </article>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const title = params.get("title") || "Project Media";
      const category = params.get("category") || "Project";
      const description = params.get("description") || "Project details are being prepared for this archive record.";
      const media = params.get("media") || "";
      const link = params.get("link") || "";

      document.title = `${title} | AESIR`;
      document.getElementById("title").textContent = title;
      document.getElementById("category").textContent = category;
      document.getElementById("description").textContent = description;

      const mediaElement = document.getElementById("media");
      mediaElement.src = media;
      mediaElement.alt = `${title} media`;

      const sourceLink = document.getElementById("source");
      const actions = document.getElementById("actions");
      const availability = document.getElementById("availability");

      if (link) {
        sourceLink.href = link;
      } else {
        actions.hidden = true;
        availability.hidden = false;
      }
    </script>
  </body>
</html>
