<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
    <title>Project Media | AESIR</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f7f8;
        --panel: #ffffff;
        --line: #d6e0e4;
        --text: #182832;
        --muted: #5f727d;
        --accent: #2f637d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: "Source Sans 3", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 48px 0;
      }

      a {
        color: inherit;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 28px;
      }

      .brand {
        color: var(--text);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }

      .back {
        border: 1px solid var(--line);
        border-radius: 0;
        padding: 10px 14px;
        text-decoration: none;
        color: var(--muted);
      }

      .panel {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 0;
        background: var(--panel);
        box-shadow: 0 24px 70px rgba(39, 62, 74, 0.13);
      }

      .media {
        background: #e4eaed;
      }

      img {
        display: block;
        width: 100%;
        max-height: 72vh;
        object-fit: contain;
      }

      .content {
        padding: 28px;
      }

      .category {
        display: inline-flex;
        margin-bottom: 16px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #edf3f5;
        padding: 7px 11px;
        color: var(--accent);
        font-size: 12px;
        font-weight: 800;
      }

      h1 {
        margin: 0;
        max-width: 820px;
        font-size: clamp(32px, 5vw, 56px);
        line-height: 1;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 24px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        border-radius: 0;
        padding: 11px 16px;
        text-decoration: none;
        font-weight: 800;
      }

      .primary {
        background: var(--accent);
        color: #ffffff;
      }

      .secondary {
        border: 1px solid var(--line);
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="topbar">
        <div class="brand">AESIR</div>
        <a class="back" href="./">Back to website</a>
      </div>

      <article class="panel">
        <div class="media">
          <img id="media" src="./assets/aesir/ernest-reading.webp" alt="AESIR project media" />
        </div>
        <div class="content">
          <span class="category" id="category"></span>
          <h1 id="title"></h1>
          <div class="actions">
            <a class="button primary" id="source" target="_blank" rel="noopener noreferrer">Open Project Link</a>
            <a class="button secondary" id="media-link" target="_blank" rel="noopener noreferrer">Open Media</a>
          </div>
        </div>
      </article>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const title = params.get("title") || "Project Media";
      const category = params.get("category") || "Project";
      const media = params.get("media") || "";
      const link = params.get("link") || "";

      document.title = `${title} | AESIR`;
      document.getElementById("title").textContent = title;
      document.getElementById("category").textContent = category;

      const mediaElement = document.getElementById("media");
      mediaElement.src = media;
      mediaElement.alt = `${title} media`;

      const mediaLink = document.getElementById("media-link");
      mediaLink.href = media;

      const sourceLink = document.getElementById("source");
      sourceLink.href = link || media;
    </script>
  </body>
</html>
